schema_version = 1

# These replaceable runtime defaults apply to every named Worker. The fleet/
# path is retained for compatibility; a worker may override individual quoted
# values in fleet/<worker>/session-defaults.toml.
runner = "codex-cli"
model = "gpt-5.6-luna"
reasoning_effort = "high"
sandbox_mode = "workspace-write"
approval_policy = "on-request"
approvals_reviewer = "auto_review"
